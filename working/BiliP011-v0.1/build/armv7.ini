[binaries]
c = '/opt/p011/sdk/bin/arm-buildroot-linux-gnueabihf-gcc'
cpp = '/opt/p011/sdk/bin/arm-buildroot-linux-gnueabihf-g++'
ar = '/opt/p011/sdk/bin/arm-buildroot-linux-gnueabihf-ar'
strip = '/opt/p011/sdk/bin/arm-buildroot-linux-gnueabihf-strip'
pkg-config = '/usr/bin/pkg-config'
[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/work/p011/prefix/lib/pkgconfig'
[built-in options]
prefix = '/work/p011/prefix'
libdir = 'lib'
buildtype = 'release'
default_library = 'shared'
c_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=hard', '-I/work/p011/prefix/include']
cpp_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=hard', '-I/work/p011/prefix/include']
c_link_args = ['-L/work/p011/prefix/lib', '-Wl,-rpath-link,/work/p011/prefix/lib', '-Wl,--allow-shlib-undefined']
cpp_link_args = ['-L/work/p011/prefix/lib', '-Wl,-rpath-link,/work/p011/prefix/lib', '-Wl,--allow-shlib-undefined']
